name: ci

# Offline checks only: no Turso token, no live API calls.
# Started by hand from the Actions tab (Run workflow). There is deliberately no
# pull_request trigger, so code from a fork never reaches a self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted

permissions:
  contents: read

jobs:
  ts:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install
        working-directory: ts
        run: npm ci --no-audit --no-fund
      - name: Build and run the offline suite
        working-directory: ts
        run: npm test
      - name: Type-check the example
        working-directory: examples
        run: npm run typecheck
      - name: Test the example against the offline mock
        working-directory: examples
        run: npm test
